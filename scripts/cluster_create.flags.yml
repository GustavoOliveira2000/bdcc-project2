--region: europe-west1
--zone: "" # Let GCP choose the zone within the region
--image-version: 2.3-ubuntu22
--master-machine-type: n4-standard-2
--initialization-actions:
  - gs://bdcc_code_v03/dask/dask.sh
--initialization-action-timeout: 60m
--properties:
  dataproc:conda.env.config.uri: gs://bdcc_code_v03/conda-env.yml
--metadata:
  dask-runtime: standalone
--optional-components:
  - JUPYTER
--enable-component-gateway:
--master-boot-disk-size: 50GB
--worker-boot-disk-size: 50GB
